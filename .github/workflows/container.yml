name: Test and publish container

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run whiteboard frontend tests
        run: node --test src/test/js/*.test.js
      - name: Run tests
        run: mvn -B test
      - name: Show test reports on failure
        if: failure()
        run: find target/surefire-reports -type f -name '*.txt' -print -exec cat {} \;

  e2e:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: repethelper
          POSTGRES_USER: repethelper
          POSTGRES_PASSWORD: repethelper
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U repethelper -d repethelper"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install browser test dependencies
        run: |
          npm ci
          npx playwright install --with-deps chromium webkit
      - name: Start application
        env:
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/repethelper
          SPRING_DATASOURCE_USERNAME: repethelper
          SPRING_DATASOURCE_PASSWORD: repethelper
          APP_BASE_URL: http://localhost:8080
          APP_MAIL_ENABLED: "false"
          APP_ADMIN_ENABLED: "false"
          APP_TEACHER_USERNAME: e2e.teacher@example.test
          APP_TEACHER_PASSWORD: E2eTeacherPassword123!
          APP_TEACHER_NAME: Тестовый преподаватель
        run: |
          nohup mvn -B spring-boot:run > app.log 2>&1 &
          for attempt in {1..90}; do
            if curl --fail --silent http://localhost:8080/actuator/health > /dev/null; then break; fi
            sleep 1
          done
          curl --fail http://localhost:8080/actuator/health
      - name: Prepare verified teacher fixture
        env:
          PGPASSWORD: repethelper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client
          psql -h localhost -U repethelper -d repethelper -v ON_ERROR_STOP=1 -c "update app_users set email='e2e.teacher@example.test', email_verified_at=now(), terms_version='2026-07-24', terms_accepted_at=now(), privacy_version='2026-07-24', personal_data_consent_at=now() where role='TEACHER';"
      - name: Run Chromium and WebKit smoke tests
        env:
          CI: "true"
          PLAYWRIGHT_TEST_BASE_URL: http://127.0.0.1:8080
          E2E_TEACHER_EMAIL: e2e.teacher@example.test
          E2E_TEACHER_PASSWORD: E2eTeacherPassword123!
        run: npm run test:e2e
      - name: Upload browser report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - name: Show application log on failure
        if: failure()
        run: tail -n 500 app.log

  publish:
    if: github.event_name != 'pull_request'
    needs: [test, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Container metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=main
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Build and publish
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
