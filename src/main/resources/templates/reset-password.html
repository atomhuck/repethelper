<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Новый пароль')}"></head>
<body class="auth-page"><main class="auth-shell compact-auth">
    <section class="auth-card">
        <a class="brand" th:href="@{/login}"><img class="brand-logo" th:src="@{/brand/repethelper-mark.png(v=1)}" alt=""><span>RepetHelper</span></a>
        <div>
            <p class="eyebrow">Безопасность</p>
            <h1>Код и новый пароль</h1>
            <p class="lead">Введите шестизначный код из письма. Он действует 15 минут.</p>
        </div>
        <div th:if="${success}" class="alert success" th:text="${success}"></div>
        <div th:if="${error}" class="alert error" th:text="${error}"></div>
        <form th:action="@{/reset-password}" method="post" class="stack-form">
            <label>Email<input type="email" name="identifier" th:value="${identifier}" required autocomplete="email"></label>
            <label>Код из письма
                <input class="code-input" name="code" inputmode="numeric" pattern="[0-9]{6}"
                       minlength="6" maxlength="6" autocomplete="one-time-code"
                       placeholder="000000" required autofocus>
            </label>
            <label>Новый пароль<input type="password" name="password" required minlength="10" maxlength="72" autocomplete="new-password"></label>
            <label>Повторите пароль<input type="password" name="passwordConfirmation" required minlength="10" maxlength="72" autocomplete="new-password"></label>
            <button class="button primary full">Сохранить пароль<svg class="ui-icon" aria-hidden="true"><use th:href="@{/brand/ui-icons.svg#arrow-right}"></use></svg></button>
        </form>
        <p class="auth-switch"><a th:href="@{/forgot-password}">Получить новый код</a></p>
    </section>
</main></body></html>
