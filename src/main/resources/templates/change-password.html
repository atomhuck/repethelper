<!doctype html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Смена пароля')}"></head><body class="auth-page"><main class="auth-shell"><section class="auth-form-card"><p class="eyebrow">Безопасность</p><h1>Установите новый пароль</h1><p class="muted">Перед продолжением необходимо заменить временный пароль.</p><p th:if="${error}" class="flash error" th:text="${error}"></p><form method="post" th:action="@{/account/change-password}" class="stack-form"><label>Текущий временный пароль<input name="currentPassword" type="password" autocomplete="current-password" required autofocus></label><label>Новый пароль<input name="password" type="password" autocomplete="new-password" required></label><label>Повторите новый пароль<input name="passwordConfirmation" type="password" autocomplete="new-password" required></label><button class="button primary" type="submit">Сохранить пароль</button></form></section></main></body></html>
