<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Восстановление пароля')}"></head>
<body class="auth-page"><main class="auth-shell compact-auth">
    <section class="auth-card">
        <a class="brand" th:href="@{/login}"><img class="brand-logo" th:src="@{/brand/repethelper-mark.svg}" alt=""><span>RepetHelper</span></a>
        <div><p class="eyebrow">Доступ к аккаунту</p><h1>Забыли пароль?</h1><p class="lead">Введите подтверждённый email. Мы пришлём шестизначный код.</p></div>
        <div th:if="${success}" class="alert success" th:text="${success}"></div>
        <form th:action="@{/forgot-password}" method="post" class="stack-form">
            <label>Email<input type="email" name="identifier" required autofocus autocomplete="email"></label>
            <button class="button primary full">Получить код<svg class="ui-icon" aria-hidden="true"><use th:href="@{/brand/ui-icons.svg#arrow-right}"></use></svg></button>
        </form>
        <p class="auth-switch"><a th:href="@{/login}"><svg class="ui-icon" aria-hidden="true"><use th:href="@{/brand/ui-icons.svg#arrow-left}"></use></svg>Вернуться ко входу</a></p>
    </section>
</main></body></html>
