<!doctype html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Карточка пользователя')}"></head><body><header class="topbar"><a class="brand" th:href="@{/control}"><img th:src="@{/brand/repethelper-mark.svg}" alt=""><span>RepetHelper Control</span></a><nav class="nav-links"><a th:href="@{/control}">Обзор</a><a class="active" th:href="@{/control/users}">Пользователи</a></nav><form method="post" th:action="@{/control/sign-out}"><button class="button ghost" type="submit">Выйти</button></form></header><main class="page-shell"><a class="back-link" th:href="@{/control/users}">← К пользователям</a><section class="page-heading"><p class="eyebrow" th:text="${target.role}"></p><h1 th:text="${target.displayName}"></h1><p class="muted" th:text="${target.username} + ' · ' + ${target.email}"></p></section><p th:if="${success}" class="flash success" th:text="${success}"></p><p th:if="${error}" class="flash error" th:text="${error}"></p><section class="admin-grid"><article class="panel"><h2>Профиль и вход</h2><p class="muted" th:text="${hasVk} ? 'VK подключён' : 'VK не подключён'"></p><p class="muted" th:text="${target.emailVerified} ? 'Email подтверждён' : 'Email ожидает подтверждения'"></p><form class="stack-form" method="post" th:action="@{/control/users/{id}/profile(id=${target.id})}"><label>Имя<input name="displayName" th:value="${target.displayName}" required></label><label>Логин<input name="username" th:value="${target.username}" required></label><label>Email<input name="email" type="email" th:value="${target.email}" required></label><label>Причина изменения<textarea name="reason" required minlength="10" maxlength="500"></textarea></label><button class="button secondary" type="submit">Сохранить профиль</button></form><form method="post" th:action="@{/control/users/{id}/sessions/revoke(id=${target.id})}" class="compact-form"><input name="reason" placeholder="Причина (10+ символов)" minlength="10" required><button class="button ghost" type="submit">Завершить сессии</button></form></article><article class="panel"><h2>Поддержка</h2><p class="muted">Откроется только чтение на 15 минут. Доступ к учебным данным фиксируется в журнале.</p><form method="post" th:action="@{/control/users/{id}/support-access(id=${target.id})}" class="stack-form"><label>Причина<textarea name="reason" required minlength="10" maxlength="500"></textarea></label><button class="button secondary" type="submit">Открыть режим поддержки</button></form></article><article class="panel danger-zone"><h2>Ограничения</h2><form method="post" th:action="@{/control/users/{id}/block(id=${target.id})}" class="stack-form"><label>Публичная причина<textarea name="publicReason" required maxlength="500"></textarea></label><label>Внутренняя заметка<textarea name="internalNote" maxlength="2000"></textarea></label><label>До (необязательно, UTC)<input name="endsAt" placeholder="2026-12-31T12:00:00Z"></label><label>Причина действия<textarea name="reason" required minlength="10" maxlength="500"></textarea></label><button class="button danger" type="submit">Заблокировать</button></form><form method="post" th:action="@{/control/users/{id}/unblock(id=${target.id})}" class="compact-form"><input name="reason" placeholder="Причина (10+ символов)" minlength="10" required><button class="button ghost" type="submit">Снять блокировку</button></form></article><article class="panel danger-zone"><h2>Удаление</h2><p class="muted">Доступ прекратится сразу. Окончательная очистка начнётся через 30 дней.</p><form method="post" th:action="@{/control/users/{id}/deletion(id=${target.id})}" class="compact-form"><input name="reason" placeholder="Причина (10+ символов)" minlength="10" required><button class="button danger" type="submit">Запланировать удаление</button></form><form method="post" th:action="@{/control/users/{id}/deletion/cancel(id=${target.id})}" class="compact-form"><input name="reason" placeholder="Причина (10+ символов)" minlength="10" required><button class="button ghost" type="submit">Отменить удаление</button></form></article></section></main></body></html>
