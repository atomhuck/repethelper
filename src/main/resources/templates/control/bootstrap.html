<!doctype html><html lang="ru" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head('Первичная настройка')}"></head><body class="auth-page"><main class="auth-shell"><section class="auth-form-card"><p class="eyebrow">Только один раз</p><h1>Создание администратора</h1><p class="muted">Эта страница доступна только через ваш закрытый Tailscale-доступ и исчезнет сразу после создания первого администратора.</p><p th:if="${error}" class="flash error" th:text="${error}"></p><form method="post" th:action="@{/control/bootstrap}" class="stack-form"><label th:if="${bootstrapTokenRequired}">Bootstrap-токен<input name="token" type="password" autocomplete="off" required></label><input th:unless="${bootstrapTokenRequired}" name="token" type="hidden" value=""><label>Логин<input name="username" autocomplete="username" required></label><label>Пароль от 14 символов<input name="password" type="password" autocomplete="new-password" required></label><button class="button primary" type="submit">Создать и настроить MFA</button></form></section></main></body></html>
