<!doctype html>
<html lang="ru" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Подтверждение email')}"></head>
<body class="auth-page"><main class="auth-shell compact-auth">
    <section class="auth-card">
        <a class="brand" th:href="@{/login}"><img class="brand-logo" th:src="@{/brand/repethelper-mark.svg}" alt=""><span>RepetHelper</span></a>
        <div>
            <p class="eyebrow">Почти готово</p>
            <h1>Введите код из письма</h1>
            <p class="lead">Мы отправили шестизначный код на <b th:text="${user.email}">email</b>. Код действует 15 минут.</p>
        </div>
        <div th:if="${success}" class="alert success" th:text="${success}"></div>
        <div th:if="${error}" class="alert error" th:text="${error}"></div>
        <form th:action="@{/verify-email}" method="post" class="stack-form">
            <label>Код подтверждения
                <input class="code-input" name="code" inputmode="numeric" pattern="[0-9]{6}"
                       minlength="6" maxlength="6" autocomplete="one-time-code"
                       placeholder="000000" required autofocus>
            </label>
            <button class="button primary full">Подтвердить email<svg class="ui-icon" aria-hidden="true"><use th:href="@{/brand/ui-icons.svg#arrow-right}"></use></svg></button>
        </form>
        <form th:action="@{/verify-email/resend}" method="post"><button class="button secondary full">Получить новый код</button></form>
        <form th:action="@{/logout}" method="post"><button class="button ghost full">Выйти</button></form>
    </section>
</main></body></html>
