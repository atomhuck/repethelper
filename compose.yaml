name: repethelper
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-repethelper}
      POSTGRES_USER: ${POSTGRES_USER:-repethelper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-repethelper}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-repethelper} -d ${POSTGRES_DB:-repethelper}"]
      interval: 5s
      timeout: 3s
      retries: 15
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-repethelper}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-repethelper}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-repethelper}
      APP_STORAGE_PATH: /app/uploads
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      APP_MAIL_ENABLED: ${APP_MAIL_ENABLED:-false}
      APP_MAIL_FROM: ${MAIL_FROM:-no-reply@repethelper.ru}
      APP_MAIL_REPLY_TO: ${MAIL_REPLY_TO:-efimok05@gmail.com}
      SPRING_MAIL_HOST: ${MAIL_HOST:-smtp.yandex.ru}
      SPRING_MAIL_PORT: ${MAIL_PORT:-465}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME:-}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      APP_VK_AUTH_ENABLED: ${APP_VK_AUTH_ENABLED:-false}
      APP_SUBSCRIPTIONS_ENABLED: ${APP_SUBSCRIPTIONS_ENABLED:-true}
      VK_CLIENT_ID: ${VK_CLIENT_ID:-}
      VK_CLIENT_SECRET: ${VK_CLIENT_SECRET:-}
      VK_REDIRECT_URI: ${VK_REDIRECT_URI:-http://localhost:8080/login/oauth2/code/vk}
      APP_TEACHER_USERNAME: ${TEACHER_USERNAME:-teacher}
      APP_TEACHER_PASSWORD: ${TEACHER_PASSWORD:-change-me-now}
      APP_TEACHER_NAME: ${TEACHER_NAME:-Преподаватель}
      APP_TEACHER_CODE: ${TEACHER_CODE:-teacher_code}
    volumes:
      - attachment-data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
volumes:
  postgres-data:
  attachment-data:
