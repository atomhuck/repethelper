name: repethelper

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-repethelper}
      POSTGRES_USER: ${POSTGRES_USER:-repethelper}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
    command:
      - postgres
      - -c
      - shared_buffers=128MB
      - -c
      - max_connections=30
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    logging: *default-logging
    networks:
      - backend

  app:
    image: ghcr.io/atomhuck/repethelper:${IMAGE_TAG:?Set IMAGE_TAG in .env.production}
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-repethelper}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-repethelper}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env.production}
      APP_STORAGE_PATH: /app/uploads
      APP_BASE_URL: https://${SITE_DOMAIN:?Set SITE_DOMAIN in .env.production}
      APP_MAIL_ENABLED: "true"
      APP_MAIL_FROM: ${MAIL_FROM:-no-reply@repethelper.ru}
      APP_MAIL_REPLY_TO: ${MAIL_REPLY_TO:-efimok05@gmail.com}
      SPRING_MAIL_HOST: ${MAIL_HOST:-smtp.yandex.ru}
      SPRING_MAIL_PORT: ${MAIL_PORT:-465}
      SPRING_MAIL_USERNAME: ${MAIL_USERNAME:?Set MAIL_USERNAME in .env.production}
      SPRING_MAIL_PASSWORD: ${MAIL_PASSWORD:?Set MAIL_PASSWORD in .env.production}
      APP_VK_AUTH_ENABLED: ${APP_VK_AUTH_ENABLED:-false}
      APP_SUBSCRIPTIONS_ENABLED: ${APP_SUBSCRIPTIONS_ENABLED:-false}
      VK_CLIENT_ID: ${VK_CLIENT_ID:-}
      VK_CLIENT_SECRET: ${VK_CLIENT_SECRET:-}
      VK_REDIRECT_URI: ${VK_REDIRECT_URI:-https://${SITE_DOMAIN:?Set SITE_DOMAIN in .env.production}/login/oauth2/code/vk}
      APP_LEGAL_OPERATOR_NAME: ${APP_LEGAL_OPERATOR_NAME:-Ефимов Ефим Александрович}
      APP_LEGAL_STATUS: ${APP_LEGAL_STATUS:-самозанятый}
      APP_LEGAL_INN: ${APP_LEGAL_INN:-701774242586}
      APP_LEGAL_CITY: ${APP_LEGAL_CITY:-Краснодар}
      APP_LEGAL_EMAIL: ${APP_LEGAL_EMAIL:-efimok05@gmail.com}
      APP_TEACHER_USERNAME: ${TEACHER_USERNAME:-teacher}
      APP_TEACHER_PASSWORD: ${TEACHER_PASSWORD:?Set TEACHER_PASSWORD in .env.production}
      APP_TEACHER_NAME: ${TEACHER_NAME:?Set TEACHER_NAME in .env.production}
      APP_TEACHER_CODE: ${TEACHER_CODE:?Set TEACHER_CODE in .env.production}
      APP_WEBSOCKET_ALLOWED_ORIGINS: https://${SITE_DOMAIN:?Set SITE_DOMAIN in .env.production}
      JAVA_TOOL_OPTIONS: -Xms256m -Xmx900m -XX:+UseG1GC -XX:+ExitOnOutOfMemoryError
    volumes:
      - attachment-data:/app/uploads
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s
    mem_limit: 1152m
    logging: *default-logging
    networks:
      - backend

  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN in .env.production}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      app:
        condition: service_healthy
    mem_limit: 128m
    logging: *default-logging
    networks:
      - backend

volumes:
  postgres-data:
    name: repethelper-postgres
  attachment-data:
    name: repethelper-attachments
  caddy-data:
    name: repethelper-caddy-data
  caddy-config:
    name: repethelper-caddy-config

networks:
  backend:
    name: repethelper-backend
